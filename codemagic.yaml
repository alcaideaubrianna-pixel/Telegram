workflows:
  android-gramsrv:
    name: MixChat Android (gramsrv)
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
          source: true
        - pattern: 'refs/tags/*'
          include: true
          source: true

    environment:
      java: 17
      # The repository currently contains the reproducible-build keystore.
      # Replace it with a Codemagic keystore before publishing production APKs.
      android_signing:
        - mixchat

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $ANDROID_SDK_ROOT/ndk/27.2.12479018
        - $ANDROID_SDK_ROOT/cmake/3.22.1

    scripts:
      - name: Verify checkout and submodules
        script: |
          set -euxo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          test -f gradlew
          test -f TMessagesProj/jni/CMakeLists.txt
          test -f TMessagesProj/lib/jlatexmath/build.gradle

      - name: Configure Android toolchain
        script: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          if [ ! -d "$SDK_ROOT/ndk/27.2.12479018" ] || [ ! -d "$SDK_ROOT/cmake/3.22.1" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | head -1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"
          fi

          java -version
          "$SDK_ROOT/cmake/3.22.1/bin/cmake" --version
          test -f "$SDK_ROOT/ndk/27.2.12479018/source.properties"

      - name: Prepare Gradle properties
        script: |
          set -euo pipefail
          # The Gradle scripts use this repository-relative path. Codemagic
          # exposes the selected signing asset at CM_KEYSTORE_PATH.
          : "${CM_KEYSTORE_PATH:?Missing CM_KEYSTORE_PATH}"
          : "${CM_KEYSTORE_PASSWORD:?Missing CM_KEYSTORE_PASSWORD}"
          : "${CM_KEY_ALIAS:?Missing CM_KEY_ALIAS}"
          : "${CM_KEY_PASSWORD:?Missing CM_KEY_PASSWORD}"
          test -f "$CM_KEYSTORE_PATH"

          keytool -list \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass:env CM_KEYSTORE_PASSWORD \
            -alias "$CM_KEY_ALIAS" >/dev/null

          SIGNING_TEST_DIR="$(mktemp -d)"
          mkdir "$SIGNING_TEST_DIR/payload"
          echo signing-test > "$SIGNING_TEST_DIR/payload/test.txt"
          jar --create --file "$SIGNING_TEST_DIR/test.jar" -C "$SIGNING_TEST_DIR/payload" .
          jarsigner \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass:env CM_KEYSTORE_PASSWORD \
            -keypass:env CM_KEY_PASSWORD \
            "$SIGNING_TEST_DIR/test.jar" "$CM_KEY_ALIAS" >/dev/null
          rm -rf "$SIGNING_TEST_DIR"

          mkdir -p TMessagesProj/config
          cp "$CM_KEYSTORE_PATH" TMessagesProj/config/release.keystore
          chmod 600 TMessagesProj/config/release.keystore

          {
            echo "RELEASE_KEY_PASSWORD=$CM_KEY_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$CM_KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD"
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties
          chmod +x ./gradlew
          echo "Signing credentials verified for alias: $CM_KEY_ALIAS"

      - name: Build gramsrv Android artifacts
        script: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace --no-parallel --max-workers=2 \
            :TMessagesProj_App:assembleAfatRelease

    artifacts:
      - TMessagesProj_App/build/outputs/apk/**/*.apk
      - TMessagesProj/build/outputs/native-debug-symbols/**/*.zip
      - /tmp/**/*.log
